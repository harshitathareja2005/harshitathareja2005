name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#be185d&color_dots=#ffe4ef,#fbcfe8,#f9a8d4,#f472b6,#ec4899
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#2d1b2e,#7a2e5a,#b8447f,#e0589a,#ff7ab8

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
